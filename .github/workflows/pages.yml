name: GitHub Pages

# Publishes docs/ to https://lopekinz.github.io/wolfenstein-modloader/
# The wiki section (docs/wiki/) is rebuilt from the GitHub wiki on every run,
# so edits in the wiki reach the site automatically (the "gollum" event).
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# (With "Deploy from a branch" → main → /docs the committed pages are served
#  as they are, without the automatic wiki rebuild.)

on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/build_site.py", ".github/workflows/pages.yml"]
  gollum:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild wiki pages from the GitHub wiki
        run: |
          git clone --depth 1 "https://github.com/${{ github.repository }}.wiki.git" "$RUNNER_TEMP/wiki"
          pip install markdown
          python scripts/build_site.py --wiki "$RUNNER_TEMP/wiki"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
